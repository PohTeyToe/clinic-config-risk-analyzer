name: "BC Test Clinic"
province: BC
clinic_type: walk_in
provider_count: 2
providers: [MD, MD]

modules:
  - ava_connect
  - autochart

billing:
  - bc_msp
  - icbc

integrations:
  - pharmanet
  - efax

connect_settings:
  auto_release_days: 14
  messaging: single_provider
  caregiver_access: false

autochart_settings:
  enabled_categories:
    - medical_histories
    - prescriptions

scheduling:
  appointment_types:
    - standard_visit
    - walk_in

role_permissions:
  physician:
    - view_all_charts
    - edit_charts
    - prescribe
    - sign_notes

templates:
  custom_note_stencils:
    - walkin_visit
